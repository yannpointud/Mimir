[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir"
version = "1.1.0"
description = "RAG chatbot for enterprise documentation"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["mimir*"]

[tool.setuptools.package-data]
"mimir.email_service" = ["templates/*.html"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend"]
# Exclusions also apply to paths passed explicitly on the command line.
force-exclude = true

# Non-source / generated paths must never be linted.
extend-exclude = [
    "data",
    "logs",
    "coverage_report",
    "backend/mimir/database/migrations",
    "frontend",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# F   = pyflakes (unused imports, undefined names, f-string issues)
# E9  = syntax errors / IndentationError
# B   = flake8-bugbear (likely bugs and design problems)
# SIM = flake8-simplify
# UP  = pyupgrade (modern syntax for the target Python version)
# BLE = flake8-blind-except (`except Exception` swallowing errors)
# C90 = mccabe cyclomatic complexity
# TID = flake8-tidy-imports (absolute imports only)
# I   = isort (import order)
# RUF = ruff-specific rules
select = ["F", "E9", "B", "SIM", "UP", "BLE", "C90", "TID", "I", "RUF"]
ignore = [
    # FastAPI dependency injection relies on calls in argument defaults
    # (Depends(), Query(), File(), Form()).
    "B008",
    # (str, Enum) -> StrEnum changes str() and format() of the members, which
    # end up in log messages and f-strings: not a pure syntax upgrade.
    "UP042",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
# Every function is annotated, and its body is type checked
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

# Third-party libraries shipping neither inline types nor a stub package.
# Libraries that do have stubs (cachetools, Markdown, psutil) get them from
# requirements-dev.txt instead of being ignored.
[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "bm25s", "bm25s.*", "docx", "docx.*"]
ignore_missing_imports = true

# Mutation testing of the pure retrieval/ingestion helpers: `mutmut run`, then
# `mutmut results` (mutants are generated under mutants/, git-ignored).
[tool.mutmut]
source_paths = ["backend/mimir"]
only_mutate = [
    "backend/mimir/rag_core/fusion.py",
    "backend/mimir/ingestion/chunking.py",
    "backend/mimir/rag_core/tokenizer_fr.py",
]
also_copy = ["pytest.ini"]
# tests/mutmut_aliases.py makes the mimir.* imports of the tests see the mutants.
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider", "-p", "tests.mutmut_aliases"]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_fusion.py",
    "tests/unit/test_ingestion_chunking.py",
    "tests/unit/test_bm25_store.py",
]
