# Mimir production stack (Compose v2). Single-server on-premise deployment.
# Only the nginx frontend publishes a host port; the backend is reachable only
# on the internal compose network.

services:
  backend:
    build:
      # Context stays the repo root: the image needs requirements.lock (root) and
      # backend/, and ./.dockerignore — read at the context root — is what keeps
      # secrets and runtime data out of the context.
      context: .
      dockerfile: docker/backend.Dockerfile
    # Secrets are injected at runtime, never COPY'd into an image layer
    # (Information Disclosure mitigation). Both files are optional so
    # `docker compose config` validates whether the operator keeps the env at
    # the repo root (./.env) or under backend/ (the current dev location).
    #
    # `format: raw` disables Compose variable interpolation inside the env
    # files. Without it, a `$word` sequence is expanded as a Compose variable
    # and silently blanked: bcrypt hashes ($2b$12$<salt>...) lose their salt,
    # which breaks admin login AND defeats the startup default-secret check,
    # since the corrupted hash no longer verifies against the known default.
    # Trade-off: raw also keeps surrounding quotes literal, so values in these
    # files must stay unquoted (they are).
    env_file:
      - path: .env
        required: false
        format: raw
      - path: backend/.env
        required: false
        format: raw
    # PRODUCTION CONSTRAINT: the backend image runs a single uvicorn worker with
    # no --reload. The in-memory FAISS singleton and the sequential ingestion
    # queue are process-local and MUST NOT be scaled to multiple workers.
    volumes:
      # Named volume persists SQLite, the FAISS index and uploaded documents
      # outside the image, surviving rebuilds (mounted at the backend data dir).
      - mimir-data:/app/data
    restart: unless-stopped
    # NOTE: no `ports:` — 8000 is intentionally NOT host-published so the API /
    # health surface is not directly reachable from the internet.

  frontend:
    build:
      # Context stays ./frontend so nginx.conf and the npm sources are in scope
      # and frontend/.dockerignore still applies. The Dockerfile itself lives
      # outside that context: BuildKit reads it client-side, so `../` is fine.
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    # The ONLY host-published port: nginx is the single ingress (:80).
    ports:
      - "80:80"
    depends_on:
      # Wait until the backend HEALTHCHECK reports healthy so nginx can resolve
      # and reach the upstream on first start.
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mimir-data:
