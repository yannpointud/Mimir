# Mimir frontend nginx config: serves the static Vite SPA and reverse-proxies
# the API to the backend compose service. The single published ingress.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload ceiling for document ingestion via the API. Kept in sync with the
    # backend's settings.max_file_size_mb (default 100 MB): a smaller value here
    # would make nginx reject with 413 an upload the backend would have accepted.
    client_max_body_size 100m;

    # Long-lived, immutable hashed build assets: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE streaming endpoint. proxy_buffering off is the load-bearing line:
    # without it nginx buffers the response and the token-by-token stream only
    # arrives once the whole answer is ready. Scoped to
    # this location ONLY -- never set server-wide. Defense in depth with the
    # backend's own X-Accel-Buffering: no header.
    location /api/v1/chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        # Keep the streamed connection open for long answers.
        proxy_read_timeout 3600s;
    }

    # All other API traffic: standard buffered reverse proxy to the backend.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
