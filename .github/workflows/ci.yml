name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job installs from the hash-pinned requirements-dev.lock (runtime, test
# and quality tools). requirements*.txt stay the source of truth; the lock
# header gives the uv command that regenerates it.

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # Runtime dependencies are needed too: mypy reads their inline types
      # (FastAPI, Pydantic, SQLAlchemy...). Config in pyproject.toml [tool.mypy].
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      # Offline: fails when a pin of requirements*.txt is not the installed
      # (locked) version, e.g. after a Dependabot bump without a regenerated lock.
      - name: Check the lockfile matches requirements
        run: pip install -q --no-deps --no-index -r requirements-dev.txt

      - name: Type check
        run: mypy backend/src

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      # The dense-retrieval and SSE snapshots of tests/oracle depend on FAISS
      # float rounding, which varies with the CPU's SIMD level (they were
      # generated on an AVX-512 machine and also fail on the original code
      # elsewhere). They run in docs/cleanup/quality_gate.sh, not on runners.
      - name: Run tests
        run: >-
          pytest
          --ignore=tests/oracle/test_retrieval_ranking.py
          --ignore=tests/oracle/test_chat_stream_events.py

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      # Any known advisory fails the job. requirements.lock is what the
      # production image installs.
      - name: Audit locked dependencies
        run: |
          pip-audit -r requirements-dev.lock --require-hashes --disable-pip
          pip-audit -r requirements.lock --require-hashes --disable-pip
