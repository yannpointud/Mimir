name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job installs from the hash-pinned lockfiles: requirements.lock (from
# requirements.txt) and requirements-dev.lock (from requirements.txt and
# requirements-dev.txt). requirements*.txt stay the source of truth; the lock
# header gives the uv command that regenerates them.

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # Runtime dependencies are needed too: mypy reads their inline types
      # (FastAPI, Pydantic, SQLAlchemy...). Config in pyproject.toml [tool.mypy].
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      # Offline: fails when a pin of requirements*.txt is not the installed
      # (locked) version, e.g. after a Dependabot bump without a regenerated lock.
      - name: Check the lockfile matches requirements
        run: pip install -q --no-deps --no-index -r requirements.txt -r requirements-dev.txt

      - name: Type check
        run: mypy backend/src

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      # The test suite only needs requirements.txt (runtime and test packages).
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.lock

      # Offline: fails when a pin of requirements.txt is not the installed
      # (locked) version, e.g. after a Dependabot bump without a regenerated lock.
      - name: Check the lockfile matches requirements
        run: pip install -q --no-deps --no-index -r requirements.txt

      - name: Run tests
        run: pytest

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      # Same ignore list as scripts/local_ci.sh; any other advisory fails the job.
      # - PYSEC-2026-107 (orjson 3.10.18, fix 3.11.5): pinned below 3.11 by
      #   mistralai 0.4.2; the fix requires migrating the Mistral SDK.
      # The lock audit covers exactly what CI installs (runtime, test and dev
      # tools); the requirements.txt audit covers what a fresh install resolves.
      - name: Audit locked dependencies
        run: >-
          pip-audit -r requirements-dev.lock --require-hashes --disable-pip
          --ignore-vuln PYSEC-2026-107

      - name: Audit runtime and test dependencies
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-107
