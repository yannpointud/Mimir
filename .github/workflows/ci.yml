name: CI

# Pull requests are checked before merge; main is checked again after each
# merge, which gives the status shown by the README badge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job installs from the hash-pinned requirements-dev.lock (runtime, test
# and quality tools). requirements*.txt stay the source of truth; the lock
# header gives the uv command that regenerates it.

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # Runtime dependencies are needed too: mypy reads their inline types
      # (FastAPI, Pydantic, SQLAlchemy...). Config in pyproject.toml [tool.mypy].
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Install the mimir package
        run: pip install --no-deps -e .

      # Offline: fails when a pin of requirements*.txt is not the installed
      # (locked) version, e.g. after a Dependabot bump without a regenerated lock.
      - name: Check the lockfile matches requirements
        run: pip install -q --no-deps --no-index -r requirements-dev.txt

      - name: Type check
        run: mypy backend/mimir

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Install the mimir package
        run: pip install --no-deps -e .

      - name: Run tests
        run: pytest

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-dev.lock

      # Any known advisory fails the job. requirements.lock is what the
      # production image installs.
      - name: Audit locked dependencies
        run: |
          pip-audit -r requirements-dev.lock --require-hashes --disable-pip
          pip-audit -r requirements.lock --require-hashes --disable-pip

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # Production dependencies only: the dev toolchain never reaches the
      # image. Moderate advisories that need a major upgrade are tolerated.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
